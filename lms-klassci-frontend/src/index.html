<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>LMS KLASSCI - Plateforme d'apprentissage</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Plateforme d'apprentissage moderne KLASSCI avec design liquid glass">
  <meta name="theme-color" content="#1e293b">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- Préchargement des ressources critiques -->
  <link rel="preload" href="assets/fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Meta pour réseaux sociaux -->
  <meta property="og:title" content="LMS KLASSCI">
  <meta property="og:description" content="Plateforme d'apprentissage moderne avec design liquid glass">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/images/og-image.jpg">

  <!-- CSS critique inline pour éviter le FOUC -->
  <style>
    /* Reset et styles critiques */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
      color: white;
      overflow: hidden;
    }

    /* Loading spinner initial */
    .initial-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .loader-content {
      text-align: center;
    }

    .loader-spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(59, 130, 246, 0.3);
      border-top: 3px solid #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    .loader-text {
      color: #e2e8f0;
      font-size: 16px;
      font-weight: 500;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Cache le loader quand Angular est chargé */
    .app-loaded .initial-loader {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }
  </style>
</head>
<body>
  <!-- Application Root -->
  <lg-root>
    <!-- Loader initial pendant chargement Angular -->
    <div class="initial-loader">
      <div class="loader-content">
        <div class="loader-spinner"></div>
        <div class="loader-text">Chargement du LMS KLASSCI...</div>
      </div>
    </div>
  </lg-root>

  <!-- Script pour cacher le loader quand Angular est prêt -->
  <script>
    // Marquer comme chargé quand Angular bootstrap
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() {
        document.body.classList.add('app-loaded');
      }, 100);
    });

    // Détection support backdrop-filter pour fallbacks
    if (!CSS.supports('backdrop-filter', 'blur(1px)')) {
      document.documentElement.classList.add('no-backdrop-filter');
    }

    // Détection device memory pour performance
    if (navigator.deviceMemory && navigator.deviceMemory < 4) {
      document.documentElement.classList.add('low-memory-device');
    }

    // Détection mobile
    if (window.innerWidth < 768) {
      document.documentElement.classList.add('mobile-device');
    }
  </script>
</body>
</html>
